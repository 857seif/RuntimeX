<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RuntimeX</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">⚡</div>
      <div class="title-box">
        <h1>RuntimeX</h1>
        <p id="arch-label" class="subtitle">Choose your system type</p>
      </div>
    </header>

    <p id="status" class="status"></p>

    <div id="arch-select" class="arch-select">
      <button class="arch-btn" data-arch="x32">
        <span class="arch-btn-title">32-bit</span>
        <span class="arch-btn-sub">x86</span>
      </button>
      <button class="arch-btn" data-arch="x64">
        <span class="arch-btn-title">64-bit</span>
        <span class="arch-btn-sub">x64</span>
      </button>
    </div>

    <main id="content" class="content hidden">
      <button id="back-btn" class="back-btn">← Change system type</button>
      <section class="section">
        <h2>Common Files</h2>
        <div id="common-list" class="list"></div>
      </section>

      <section class="section">
        <h2 id="specific-title">Architecture Files</h2>
        <div id="specific-list" class="list"></div>
      </section>
    </main>

    <footer class="footer">RuntimeX — install missing runtimes in one click</footer>
  </div>

  <script src="main.js"></script>
</body>
</html>
